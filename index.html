<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Market El Rinconcito</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--text:#1f2a24;--muted:#6b756f;--brand:#1f8a4c;--brand-text:#fff;--accent:#ffb703;--border:#e8e2d2;--tile:#f3efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1e2721;--text:#eef2ee;--muted:#9aa89f;--brand:#3ecf7a;--brand-text:#0c1a12;--accent:#ffc83d;--border:#2c3830;--tile:#27322b}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1e2721;--text:#eef2ee;--muted:#9aa89f;--brand:#3ecf7a;--brand-text:#0c1a12;--accent:#ffc83d;--border:#2c3830;--tile:#27322b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-text);display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
header h1{margin:0;font-size:1.2rem}
.cartbtn{background:var(--accent);color:#1f2a24;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.95rem}
.hero{max-width:1000px;margin:0 auto;padding:28px 20px 8px}
.hero h2{margin:0 0 6px;font-size:1.7rem}
.hero p{margin:0;color:var(--muted)}
.cats{max-width:1000px;margin:14px auto 0;padding:0 20px;display:flex;gap:8px;overflow-x:auto}
.cats button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.cats button.on{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.grid{max-width:1000px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.img{background:var(--tile);border-radius:12px;height:96px;display:grid;place-items:center;font-size:3.2rem}
.card h3{margin:4px 0 0;font-size:.98rem}
.card small{color:var(--muted)}
.price{font-weight:800;font-size:1.1rem}
.add{margin-top:auto;border:0;background:var(--brand);color:var(--brand-text);border-radius:10px;padding:9px;font-weight:700;cursor:pointer}
.tag{align-self:flex-start;background:var(--accent);color:#1f2a24;font-size:.7rem;font-weight:800;border-radius:6px;padding:2px 7px}
#panel{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.ph h2{margin:0;font-size:1.1rem}
.x{background:none;border:0;color:var(--text);font-size:1.4rem;cursor:pointer}
#items{flex:1;overflow-y:auto;padding:10px 18px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.row .e{font-size:1.8rem}
.row .n{flex:1;font-size:.92rem}
.row .n b{display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--tile);color:var(--text);cursor:pointer}
.foot{padding:16px 18px;border-top:1px solid var(--border)}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800;margin-bottom:12px}
.pay{width:100%;border:0;background:var(--brand);color:var(--brand-text);padding:13px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:40px 0}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
#shade.open{display:block}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>🛒 El Rinconcito</h1><button class="cartbtn" id="open">Carrito (<span id="cnt">0</span>)</button></header>
<section class="hero"><h2>Todo lo que necesitás, a la vuelta de la esquina</h2><p>Mini market abierto de 7 a 23 h · Envíos en el barrio</p></section>
<nav class="cats" id="cats"></nav>
<main class="grid" id="grid"></main>
<div id="shade"></div>
<aside id="panel"><div class="ph"><h2>Tu carrito</h2><button class="x" id="close">✕</button></div><div id="items"></div><div class="foot"><div class="total"><span>Total</span><span id="tot">$0</span></div><button class="pay" id="pay">Finalizar compra</button></div></aside>
<div id="toast"></div>
<script>
var P=[
{n:"Leche entera 1 L",c:"Lácteos",e:"🥛",p:1450},
{n:"Queso cremoso",c:"Lácteos",e:"🧀",p:4200,t:"Oferta"},
{n:"Huevos x12",c:"Lácteos",e:"🥚",p:3100},
{n:"Manteca 200 g",c:"Lácteos",e:"🧈",p:2300},
{n:"Pan fresco 1 kg",c:"Panadería",e:"🍞",p:2800},
{n:"Medialunas x6",c:"Panadería",e:"🥐",p:3500,t:"Nuevo"},
{n:"Manzanas 1 kg",c:"Frutas y verduras",e:"🍎",p:2600},
{n:"Bananas 1 kg",c:"Frutas y verduras",e:"🍌",p:2200},
{n:"Tomates 1 kg",c:"Frutas y verduras",e:"🍅",p:2900},
{n:"Paltas x2",c:"Frutas y verduras",e:"🥑",p:3300},
{n:"Gaseosa cola 2 L",c:"Bebidas",e:"🥤",p:3200},
{n:"Agua mineral 2 L",c:"Bebidas",e:"💧",p:1500},
{n:"Vino tinto Malbec",c:"Bebidas",e:"🍷",p:6900,t:"Mendoza"},
{n:"Cerveza lata 473 ml",c:"Bebidas",e:"🍺",p:1900},
{n:"Papas fritas 150 g",c:"Snacks",e:"🥔",p:2400},
{n:"Chocolate en barra",c:"Snacks",e:"🍫",p:1800,t:"Oferta"},
{n:"Galletitas dulces",c:"Snacks",e:"🍪",p:1700},
{n:"Fideos 500 g",c:"Almacén",e:"🍝",p:1600},
{n:"Arroz 1 kg",c:"Almacén",e:"🍚",p:2100},
{n:"Café molido 250 g",c:"Almacén",e:"☕",p:5400}
];
var cats=["Todo"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
var cur="Todo",cart={};
function $(i){return document.getElementById(i)}
function money(n){return "$"+n.toLocaleString("es-AR")}
function drawCats(){$("cats").innerHTML=cats.map(function(c){return '<button class="'+(c===cur?"on":"")+'" data-c="'+c+'">'+c+'</button>'}).join("")}
function drawGrid(){
 $("grid").innerHTML=P.map(function(x,i){return x}).map(function(x,i){return {x:x,i:i}}).filter(function(o){return cur==="Todo"||o.x.c===cur}).map(function(o){var x=o.x;
 return '<div class="card"><div class="img">'+x.e+'</div>'+(x.t?'<span class="tag">'+x.t+'</span>':'')+'<h3>'+x.n+'</h3><small>'+x.c+'</small><div class="price">'+money(x.p)+'</div><button class="add" data-i="'+o.i+'">Agregar</button></div>'}).join("")}
function drawCart(){
 var ids=Object.keys(cart),n=0,t=0;
 $("items").innerHTML=ids.length?ids.map(function(i){var x=P[i],q=cart[i];n+=q;t+=q*x.p;
 return '<div class="row"><span class="e">'+x.e+'</span><div class="n"><b>'+x.n+'</b>'+money(x.p)+'</div><div class="qty"><button data-m="'+i+'">−</button><span>'+q+'</span><button data-a="'+i+'">+</button></div></div>'}).join(""):'<div class="empty">Tu carrito está vacío</div>';
 $("cnt").textContent=n;$("tot").textContent=money(t)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1600)}
function panel(o){$("panel").classList.toggle("open",o);$("shade").classList.toggle("open",o)}
document.addEventListener("click",function(e){var d=e.target.dataset;
 if(d.c){cur=d.c;drawCats();drawGrid()}
 if(d.i){cart[d.i]=(cart[d.i]||0)+1;drawCart();toast(P[d.i].n+" agregado")}
 if(d.a){cart[d.a]++;drawCart()}
 if(d.m){cart[d.m]--;if(!cart[d.m])delete cart[d.m];drawCart()}});
$("open").onclick=function(){panel(true)};$("close").onclick=$("shade").onclick=function(){panel(false)};
$("pay").onclick=function(){if(!Object.keys(cart).length){toast("Agregá algo primero");return}cart={};drawCart();panel(false);toast("¡Gracias por tu compra! (demo)")};
drawCats();drawGrid();drawCart();
</script>
</body>
</html>
